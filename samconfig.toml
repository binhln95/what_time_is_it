version = 0.1

# Default environment: dev  (sam deploy)
[default.global.parameters]
stack_name = "what-time"

[default.deploy.parameters]
region = "ap-southeast-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
# WebHosting=amplify: CloudFront is blocked until AWS Support verifies the account.
# Switch to WebHosting=cloudfront once verified (or none to run the web app only locally).
parameter_overrides = "Stage=dev WebHosting=amplify"

# Production: sam deploy --config-env prod
[prod.global.parameters]
stack_name = "what-time-prod"

[prod.deploy.parameters]
region = "ap-southeast-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
parameter_overrides = "Stage=prod"
